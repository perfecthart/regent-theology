}

  :root:not(.light) {
    --bg: #0F0D0F;
    --surface: #1A1518;
    --surface-2: #221B20;
    --text: #F2ECE6;
    --text-muted: #9A8F8B;
    --text-faint: rgba(242,236,230,0.55);

    --border-strong: rgba(242,236,230,0.22);

    --ink: #F2ECE6;
  }
}
